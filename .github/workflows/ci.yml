name: CI

on:
  push:
    branches: [main, "feat/**", "release/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Format check (black)
        run: python -m black --check .
      - name: Type check (mypy)
        run: python -m mypy
      - name: Tests + coverage gate
        env:
          SENTINEL_FORCE_OFFLINE: "1"
        run: python -m pytest tests/ -q --cov=sentinel --cov-report=term --cov-fail-under=80
      - name: Security regression suite (invariants + evaluation smoke)
        env:
          SENTINEL_FORCE_OFFLINE: "1"
        run: |
          python -m pytest tests/test_invariants.py -q
          python -m sentinel eval run --suite security --out /tmp/results
          python -m sentinel eval run --suite heldout --out /tmp/results
          python -m sentinel eval run --suite surfaces --out /tmp/results
          python -m sentinel eval run --suite kyb --out /tmp/results
          python -m sentinel eval run --suite ablation --out /tmp/results
          python -m sentinel eval run --suite integrity --out /tmp/results
          python -m sentinel eval run --suite temporal --out /tmp/results
          python -m sentinel eval run --suite claims --out /tmp/results
      - name: CLI + audit chain smoke
        env:
          SENTINEL_FORCE_OFFLINE: "1"
          SENTINEL_DB: /tmp/ci.db
        run: |
          python -m sentinel data generate --seed 42 --customers 100 --merchants 20 --transactions 2000
          python -m sentinel analyze --transactions 40 --disputes 10 --applications 5 --sessions 10 --accounts 4
          python -m sentinel security attack --scenario document_injection --compare
          python -m sentinel audit verify
          python -m sentinel audit checkpoint --out /tmp/audit-checkpoint.json
          python -m sentinel audit verify --checkpoint /tmp/audit-checkpoint.json
      - name: Docker build
        run: docker build -t sentinel .
