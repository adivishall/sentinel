[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-decision-security"
version = "2.2.0"
description = "Financial decision security for AI-assisted finance: AI may recommend; trusted evidence, deterministic policy and authorization decide."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "adivishall" }]
keywords = ["fintech", "ai-security", "llm-security", "prompt-injection", "fraud-detection", "policy-as-code", "audit-log", "decision-integrity"]
# One runtime dependency: pyca/cryptography, for Ed25519 signatures on fact envelopes
# (sentinel/trust). Everything else is the standard library (sqlite3, http.server, ...).
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/adivishall/sentinel"
Console = "https://adivishall.github.io/sentinel/"
Documentation = "https://github.com/adivishall/sentinel/tree/main/docs"
Changelog = "https://github.com/adivishall/sentinel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
live = ["anthropic==1.11.0"]
charts = ["matplotlib==3.9.2"]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "hypothesis==6.148.13", "ruff==0.16.5", "black==26.5.1", "mypy==2.3.1"]

[project.scripts]
sentinel = "sentinel.cli.main:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["policy/policies/*.json", "evaluation/attacks/*.json", "trust/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["submission", "social", "data", "results", "ui"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "submission|social|results|data"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "silent"
files = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["sentinel"]
omit = ["*/__pycache__/*", "sentinel/evaluation/charts.py"]

[tool.coverage.report]
fail_under = 80
show_missing = false
