[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-decision-security"
version = "2.0.0"
description = "Financial Decision Security Infrastructure for AI-native finance: AI may recommend; trusted evidence, deterministic risk controls and explicit policy authorize."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "adivishall" }]
keywords = ["ai-security", "prompt-injection", "fraud-risk", "policy-as-code", "fintech", "decision-integrity", "audit"]
dependencies = []  # the core is standard library only (sqlite3, http.server, dataclasses)

[project.optional-dependencies]
live = ["anthropic==0.40.0"]
charts = ["matplotlib==3.9.2"]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "hypothesis==6.148.13", "ruff==0.16.5", "black==26.5.1", "mypy==2.3.1"]

[project.scripts]
sentinel = "sentinel.cli.main:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["policy/policies/*.json", "evaluation/attacks/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["submission", "social", "notebooks", "data", "results", "ui"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "submission|social|results|data"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "silent"
files = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["sentinel"]
omit = ["*/__pycache__/*", "sentinel/agents/providers/anthropic.py", "sentinel/evaluation/charts.py"]

[tool.coverage.report]
fail_under = 80
show_missing = false
